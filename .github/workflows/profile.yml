name: profile

# One workflow, so its runs queue instead of pushing over each other:
#  - every 10 minutes around sunrise and sunset, scripts/daynight.py points the README at the
#    white artwork while the sun is up in Bucharest and the black artwork after dark. The two
#    UTC windows cover Bucharest's whole year (sunrise 02:32-05:53 UTC, sunset 14:36-18:04 UTC).
#  - once a day, and whenever the renderer, copy or fonts change, contributions are fetched
#    again and every card is redrawn (both variants).

"on":
  schedule:
    - cron: "3-59/10 2-6 * * *"     # sunrise window
    - cron: "3-59/10 14-18 * * *"   # sunset window
    - cron: "17 10 * * *"           # daily redraw (midday in Bucharest)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "data/content.json"
      - "fonts/*.woff2"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # the sunrise/sunset checks only flip the README; everything else also redraws
      REDRAW: ${{ github.event_name != 'schedule' || github.event.schedule == '17 10 * * *' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.REDRAW == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - if: env.REDRAW == 'true'
        run: pip install -r scripts/requirements.txt
      - name: Fetch contributions
        if: env.REDRAW == 'true'
        env:
          # Optional secret CARDS_TOKEN (read:user) also counts private contributions; this
          # profile shows them publicly already, so the job token gets the same numbers.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
        run: python scripts/fetch_data.py
      - name: Render cards
        if: env.REDRAW == 'true'
        run: python scripts/render_cards.py

      - name: Day or night
        run: python3 scripts/daynight.py

      - name: Commit if anything changed
        run: |
          # committed as the Actions bot, so these commits never show up in the heat grid
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/profile.json cards/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          msg="profile: refresh $(date -u +%Y-%m-%d)"
          if git diff --cached --quiet -- cards/ data/; then
            mode=$(grep -q 'cards/hero-light.svg' README.md && echo day || echo night)
            msg="profile: switch to $mode"
          fi
          git commit -m "$msg"
          git pull --rebase --autostash
          git push
